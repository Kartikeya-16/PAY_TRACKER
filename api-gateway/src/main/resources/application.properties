spring.application.name=api-gateway
server.port=8080

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:3000,http://localhost:5173
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*

management.endpoints.web.exposure.include=gateway,health,info
management.endpoint.gateway.access=read-only

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**

spring.cloud.gateway.server.webflux.routes[1].id=ledger-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://LEDGER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/transactions/**

spring.cloud.gateway.server.webflux.routes[2].id=subscription-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://SUBSCRIPTION-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/subscriptions/**

spring.cloud.gateway.server.webflux.routes[3].id=analytics-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://ANALYTICS-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/budgets/**,/api/analytics/**

spring.cloud.gateway.server.webflux.routes[4].id=notification-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/notifications/**